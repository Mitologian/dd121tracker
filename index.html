function buildSchedule(){
  var q=[];
  function push(list,mode,rd){list.forEach(function(m){q.push({id:m.id,mode:mode,r:rd})})}
  var t1a=byT('1A'), p=pros(), t1b=byT('1B');
  var adj=t1b.filter(function(m){return m.a}), t1bn=t1b.filter(function(m){return !m.a});
  var t1ball=t1bn.concat(adj);
  var t2=byT('2').filter(function(m){return !m.p}), t3=byT('3');
  push(t1a,'1A1',1);      // 12  W1-3
  push(p,'P',1);          // 17  W4-8
  push(adj,'ADJ',1);      // 3   W8
  push(t1bn,'1B',1);      // 13  W9-12
  push(t1a,'1A2',2);      // 12  W12-15
  push(p,'P',2);          // 17  W15-19
  push(t1ball,'1B',2);    // 16  W19-23
  push(t1a,'1A2',3);      // 12  W23-26
  push(t2,'23',1);        // 32  W26-34
  push(p,'P',3);          // 17  W34-38
  push(t1ball,'1B',3);    // 16  W38-42
  push(t3,'23',1);        // 39  W42-52
  var weeks=[];
  for(var w=1;w<=52;w++){
    var slots=q.slice((w-1)*4,(w-1)*4+4);
    while(slots.length<4)slots.push({id:null,mode:'23',r:0});
    weeks.push({w:w,mo:Math.min(12,Math.ceil(w/4.3334)),slots:slots,ask:ASKS[(w-1)%ASKS.length],named:(w%4===2),sp:SPECIAL[w]||null});
  }
  return weeks;
}

function addTarget(){var n=document.getElementById('tn').value.trim();if(!n){toast('Isi nama perusahaan');return}
 S.targets.push({n:n,why:document.getElementById('tw').value.trim(),who:document.getElementById('to').value.trim()});saveS();render();toast('Target ditambahkan')}
function delTarget(i){S.targets.splice(i,1);saveS();render()}
function kpi(k,d){S.kpi[k]=Math.max(0,(S.kpi[k]||0)+d);saveS();render()}
function addDeal(){var n=document.getElementById('dn').value.trim(),v=document.getElementById('dv').value,s=document.getElementById('ds').value;
 if(!n){toast('Isi nama dulu');return}S.deals.unshift({n:n,v:v||0,s:s});saveS();render();toast('Deal ditambahkan')}
function delDeal(i){S.deals.splice(i,1);saveS();render()}
function importJSON(){
  var i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=function(){
    var f=i.files&&i.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(typeof o!=='object'||!o) throw 0;
        if(!confirm('Ganti semua data di perangkat ini dengan isi file tersebut? Data yang sekarang akan hilang.'))return;
        S={met:{},notes:{},vcp:{},lvl:{},task:{},sub:{},skip:{},extra:[],targets:[],log:[],xslots:{},
           kpi:{given:0,recv:0,cohost:0,oam:0,lakon:0},deals:[],week:1};
        for(var k in o)S[k]=o[k];
        if(!S.log)S.log=[]; if(!S.xslots)S.xslots={}; if(!S.sub)S.sub={}; if(!S.skip)S.skip={};
        if(!S.extra)S.extra=[]; if(!S.targets)S.targets=[]; if(!S.deals)S.deals=[];
        saveS(); loadExtras(); render(); updateTop();
        toast('Data dipulihkan: '+(S.log||[]).length+' sesi');
      }catch(e){ toast('File tidak terbaca. Pastikan itu file ekspor dari app ini.') }
    };
    r.readAsText(f);
  };
  i.click();
}
function exportJSON(){
 var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bni-engine-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Data diekspor')}
