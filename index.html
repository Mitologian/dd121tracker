<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>121 Notebook</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#CF142B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="121 Notebook">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23CF142B'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3E121%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F3EC;--card:#fff;--ink:#1D1B17;--muted:#7A746A;--line:#E7E1D4;
  --accent:#CF142B;--accent-soft:#FBE9EB;--ok:#1F7A5A;--ok-soft:#E4F3EC;--warn:#B26A00;--warn-soft:#FBF0DB;
  --r:14px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#171613;--card:#211F1B;--ink:#F1EDE4;--muted:#A39D90;--line:#34312B;
  --accent:#F0475A;--accent-soft:#3A1D21;--ok:#4FC79B;--ok-soft:#183328;--warn:#E8A23B;--warn-soft:#3A2D14;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
header h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.pend{background:var(--warn)}
main{flex:1;padding:4px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2,.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sec{margin:18px 2px 8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats .card{margin:0;padding:12px;text-align:center}
.stats .big{font-size:24px}
.stats .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring.done .fg{stroke:var(--ok)}
.ring text{font-weight:800;font-size:22px;fill:var(--ink);text-anchor:middle}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;position:relative;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted)}
.bars .b i{display:block;width:100%;background:var(--line);border-radius:4px 4px 0 0;min-height:2px}
.bars .b.hit i{background:var(--ok)}.bars .b.cur i{background:var(--accent)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.5}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.bar .nm{width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar .ct{width:26px;text-align:right;font-weight:700}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px}
label .hint{font-weight:400;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;font-size:14.5px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.danger{background:none;color:var(--accent);padding-left:0;padding-right:0}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.pc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;cursor:pointer}
.pc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc b{font-size:15.5px}
.pc .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.pc .nx{margin-top:7px;font-size:13px;background:var(--accent-soft);border-radius:8px;padding:6px 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.depth{display:inline-flex;gap:3px}
.depth i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.depth i.f{background:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--line);color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom))}
.panel .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.panel h3{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.kv{margin-top:14px}
.kv .k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kv .v{white-space:pre-wrap;word-break:break-word}
.bcm{display:grid;grid-template-columns:1fr;gap:6px}
.bcm div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.bcm div b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.bcm .B b{color:#A0703C}.bcm .C b{color:#B89012}.bcm .M b{color:var(--accent)}
.tl{border-left:2px solid var(--line);margin:8px 0 0 5px;padding-left:14px}
.tl .it{position:relative;padding-bottom:16px}
.tl .it:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .d{font-size:12.5px;font-weight:700}
.tl .t{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.tl .n{margin-top:5px;font-size:13px;background:var(--accent-soft);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sc{display:flex;gap:12px;align-items:flex-start}
.sc .dt{flex:none;width:52px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 0}
.sc .dt b{display:block;font-size:20px;line-height:1.1}.sc .dt span{font-size:11px;font-weight:700;text-transform:uppercase}
.sc.past .dt{background:var(--line);color:var(--muted)}
.sc .ag{font-size:13px;margin-top:4px;white-space:pre-wrap}
a.lnk{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);padding:6px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl">121 Notebook<small id="sub"></small></h1>
    <button class="sync" id="syncbtn" onclick="openSettings()"><span class="dot" id="dot"></span><span id="syncl">Lokal</span></button>
  </header>
  <main id="view"></main>
  <nav><div class="in">
    <button data-t="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
    <button data-t="note"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Catat</button>
    <button data-t="sched"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Jadwal</button>
    <button data-t="ppl"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>Orang</button>
  </div></nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ konstanta ============ */
var TARGET = 4;
var KEY = 'dd121notebook.v2';
var PROF = ['chapter','klas','wa','bisnis','bread','cheese','meat','trigger','sphere','klien','good','bad'];
var PROFLABEL = {bisnis:'Bisnis / layanan',bread:'Bread',cheese:'Cheese',meat:'Meat',trigger:'Trigger words',sphere:'Contact sphere',klien:'Contoh klien',good:'Good referrals',bad:'Bad referrals'};
var DEPTH = ['Kenal','Paham','Referral'];
function lvl(n){ return Math.min(3,Math.max(1,+n||1)) }
function waNum(s){ var d=String(s||'').replace(/\D/g,''); if(d.indexOf('0')===0) d='62'+d.slice(1); else if(d.indexOf('8')===0) d='62'+d; return d }
function waLink(phone,text){ return 'https://wa.me/'+waNum(phone)+(text?'?text='+encodeURIComponent(text):'') }
function first(n){ return String(n||'').trim().split(/\s+/)[0] }
var KLAS_DEFAULT = ['Keuangan & Asuransi','Properti','Hukum & Akuntansi','Marketing & Digital','Teknologi','Kesehatan','F&B','Manufaktur & Trading','Pendidikan & Training','Konstruksi','Event & Hospitality','Logistik'];

/* ============ state & penyimpanan ============ */
var S = {sessions:[],sched:[],queue:[],cfg:{url:'',token:''},tab:'dash',q:'',filt:'',lastSync:0,syncing:false,offline:false};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({sessions:S.sessions,sched:S.sched,queue:S.queue,cfg:S.cfg,lastSync:S.lastSync})) }catch(e){} }
function load(){
  try{ var d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d){ S.sessions=d.sessions||[]; S.sched=d.sched||[]; S.queue=d.queue||[]; S.cfg=d.cfg||S.cfg; S.lastSync=d.lastSync||0 } }catch(e){}
}

/* ============ util ============ */
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function pad(n){ return (n<10?'0':'')+n }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) }
function today(){ return ymd(new Date()) }
function nowLocal(){ var d=new Date(); return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()) }
function pd(s){ var p=String(s).slice(0,10).split('-'); return new Date(+p[0],+p[1]-1,+p[2]) }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x }
function monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x }
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function fdate(s){ if(!s)return ''; var d=pd(s); return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear() }
function days(s){ return Math.round((pd(today())-pd(s))/864e5) }
function ago(s){ if(!s)return 'belum pernah'; var n=days(s); if(n<=0)return 'hari ini'; if(n===1)return 'kemarin'; if(n<7)return n+' hari lalu'; if(n<30)return Math.round(n/7)+' minggu lalu'; if(n<365)return Math.round(n/30)+' bulan lalu'; return Math.round(n/365)+' tahun lalu' }
function live(a){ return a.filter(function(x){return x.deleted!=='1'}) }
function toast(m){ var t=$('toast'); t.textContent=m; t.className='toast on'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='toast'},2400) }
function nl(s){ return esc(s) }
function trim(s){ return (s||'').trim() }

/* ============ turunan data ============ */
function people(){
  var m={}, ss=live(S.sessions).slice().sort(function(a,b){ return a.date===b.date ? (a.updated<b.updated?-1:1) : (a.date<b.date?-1:1) });
  ss.forEach(function(s){
    var p=m[s.pid]||(m[s.pid]={pid:s.pid,name:s.name,sess:[],f:{}});
    p.sess.push(s); p.name=s.name;
    PROF.forEach(function(k){ if(trim(s[k])) p.f[k]=s[k] });
    if(+s.depth) p.depth=lvl(s.depth);
  });
  var sc=live(S.sched);
  sc.forEach(function(x){ if(!m[x.pid]) m[x.pid]={pid:x.pid,name:x.name,sess:[],f:{}} });
  var now=nowLocal();
  return Object.keys(m).map(function(k){
    var p=m[k]; p.n=p.sess.length; p.last=p.sess[p.n-1]||{}; p.lastDate=p.last.date||''; p.rin=p.last.rin==='1'; p.rout=p.last.rout==='1'; p.next=''; for(var i=p.n-1;i>=0;i--){ if(trim(p.sess[i].next)){ p.next=trim(p.sess[i].next); break } } p.depth=p.depth||1;
    p.up=sc.filter(function(x){return x.pid===p.pid&&x.status==='planned'&&x.start>=now}).sort(function(a,b){return a.start<b.start?-1:1})[0];
    p.missing=Object.keys(PROFLABEL).filter(function(f){return !trim(p.f[f])});
    p.filled=Object.keys(PROFLABEL).length-p.missing.length;
    p.hay=(p.name+' '+PROF.map(function(f){return p.f[f]||''}).join(' ')+' '+p.sess.map(function(s){return (s.notes||'')+' '+(s.next||'')}).join(' ')).toLowerCase();
    return p;
  });
}
function byRecent(a,b){ var x=a.lastDate||'0', y=b.lastDate||'0'; return x===y ? a.name.localeCompare(b.name) : (x<y?1:-1) }
function findPerson(name){ var n=trim(name).toLowerCase(); if(!n)return null; return people().filter(function(p){return p.name.toLowerCase()===n})[0]||null }
function weekCounts(){ var c={}; live(S.sessions).forEach(function(s){ var k=ymd(monday(pd(s.date))); c[k]=(c[k]||0)+1 }); return c }
function allKlas(){ var set={}; KLAS_DEFAULT.forEach(function(k){set[k]=1}); live(S.sessions).forEach(function(s){ if(trim(s.klas)) set[trim(s.klas)]=1 }); return Object.keys(set).sort() }

/* ============ sinkronisasi (Apps Script) ============ */
function connected(){ return !!(S.cfg.url && S.cfg.token) }
function setSync(){
  var d=$('dot'), l=$('syncl');
  if(!connected()){ d.className='dot'; l.textContent='Lokal' }
  else if(S.syncing){ d.className='dot pend'; l.textContent='Sinkron…' }
  else if(S.queue.length||S.offline){ d.className='dot pend'; l.textContent=S.queue.length+' belum terkirim' }
  else { d.className='dot ok'; l.textContent='Tersimpan di Sheet' }
}
function post(payload){
  payload.token=S.cfg.token;
  return fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json()});
}
function enqueue(table,row){
  row.updated=new Date().toISOString();
  var arr = table==='Sessions'?S.sessions:S.sched;
  var i=arr.findIndex(function(x){return x.id===row.id});
  if(i>=0) arr[i]=row; else arr.push(row);
  S.queue=S.queue.filter(function(q){return !(q.table===table&&q.id===row.id)});
  S.queue.push({table:table,id:row.id});
  save(); setSync(); flush();
}
function flush(){
  if(!connected()||S.syncing||!S.queue.length) return Promise.resolve();
  S.syncing=true; setSync();
  var job=S.queue[0], arr=job.table==='Sessions'?S.sessions:S.sched, row=arr.find(function(x){return x.id===job.id});
  if(!row){ S.queue.shift(); S.syncing=false; return flush() }
  return post({action:'upsert',table:job.table,row:row}).then(function(r){
    if(!r.ok) throw new Error(r.error||'gagal');
    S.queue.shift();
    var cur=arr.find(function(x){return x.id===job.id});
    if(cur && r.row && r.row.eventId!==undefined) cur.eventId=r.row.eventId;
    S.offline=false; S.syncing=false; save(); setSync(); return flush();
  }).catch(function(e){
    S.syncing=false; S.offline=true; setSync();
    if(String(e.message)==='token') toast('Token salah. Cek Pengaturan.');
  });
}
function pull(){
  if(!connected()) return Promise.resolve();
  S.syncing=true; setSync();
  return fetch(S.cfg.url+(S.cfg.url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(S.cfg.token)).then(function(r){return r.json()}).then(function(r){
    if(!r.ok) throw new Error(r.error||'gagal');
    merge(S.sessions,r.sessions); merge(S.sched,r.schedule);
    S.lastSync=Date.now(); S.offline=false; S.syncing=false; save(); setSync(); render();
  }).catch(function(e){ S.syncing=false; S.offline=true; setSync(); if(String(e.message)==='token') toast('Token salah. Cek Pengaturan.') });
}
function merge(local,remote){
  (remote||[]).forEach(function(r){
    var i=local.findIndex(function(x){return x.id===r.id});
    if(i<0) local.push(r);
    else if(r.updated>local[i].updated && !S.queue.some(function(q){return q.id===r.id})) local[i]=r;
  });
}
function syncAll(){ return flush().then(pull) }

/* ============ navigasi ============ */
function go(t){ S.tab=t; window.scrollTo(0,0); render(); }
function render(){
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===S.tab) });
  var v={dash:vDash,note:vNote,sched:vSched,ppl:vPpl}[S.tab];
  $('view').innerHTML=v();
  var after={dash:fillList,note:aNote,sched:aSched}[S.tab]; if(after) after();
  var d=new Date(); $('sub').textContent=HARI[d.getDay()]+', '+fdate(today());
}
document.querySelectorAll('nav button').forEach(function(b){ b.onclick=function(){ closeModal(); if(b.dataset.t==='note') S.edit=null; go(b.dataset.t) } });
function openModal(h){ $('panel').innerHTML='<div class="grab"></div>'+h; $('modal').classList.add('on'); $('panel').scrollTop=0 }
function closeModal(){ $('modal').classList.remove('on') }

/* ============ DASHBOARD ============ */
function depthDots(n){ var h='<span class="depth" title="'+esc(DEPTH[lvl(n)-1])+'">'; for(var i=1;i<=3;i++) h+='<i'+(i<=n?' class="f"':'')+'></i>'; return h+'</span>' }
function refTags(p){ return (p.rin?'<span class="tag ok" title="Dia pernah kasih saya referral bagus">⬇ Dari dia</span>':'')+(p.rout?'<span class="tag acc" title="Saya pernah kasih dia referral">⬆ Ke dia</span>':'') }
function card(p){
  var h='<button class="pc" onclick="openPerson(\''+p.pid+'\')"><div class="top"><b>'+esc(p.name)+'</b><span class="small muted">'+esc(ago(p.lastDate))+'</span></div>'
   +'<div class="meta">'+esc([p.f.klas,p.f.chapter].filter(Boolean).join(' · ')||'Klasifikasi belum diisi')+(p.f.bisnis?' · '+esc(p.f.bisnis.split('\n')[0].slice(0,50)):'')+'</div>';
  if(p.next) h+='<div class="nx">➜ '+esc(p.next)+'</div>';
  h+='<div class="ft">'+depthDots(p.depth)+'<span>121 ke-'+p.n+'</span>'+refTags(p)+(p.up?'<span class="tag acc">'+esc(fdate(p.up.start))+'</span>':'')+'<span style="margin-left:auto">profil '+p.filled+'/9</span></div></button>';
  return h;
}
function vDash(){
  var ss=live(S.sessions), wc=weekCounts(), cur=ymd(monday(new Date())), n=wc[cur]||0, P=people();
  var pct=Math.min(1,n/TARGET), C=2*Math.PI*34;
  var up=live(S.sched).filter(function(x){ var mo=ymd(monday(pd(x.start))); return x.status==='planned'&&mo===cur&&x.start>=nowLocal() }).length;
  var left=Math.max(0,TARGET-n);
  var msg=n>=TARGET?'Target minggu ini tercapai.':(left+' lagi untuk target'+(up?', '+up+' sudah terjadwal':'')+'.');
  // streak minggu berturut-turut yang memenuhi target
  var streak=0, w=monday(new Date()); if((wc[ymd(w)]||0)>=TARGET) streak++; w=addDays(w,-7);
  while((wc[ymd(w)]||0)>=TARGET){ streak++; w=addDays(w,-7) }
  var h='<div class="card"><div class="row"><svg class="ring'+(n>=TARGET?' done':'')+'" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="34"/><circle class="fg" cx="42" cy="42" r="34" transform="rotate(-90 42 42)" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/><text x="42" y="50">'+n+'/'+TARGET+'</text></svg>'
   +'<div class="grow"><h2 style="margin:0 0 4px">Minggu ini</h2><div style="font-weight:600">'+esc(msg)+'</div>'+(streak?'<div class="small muted" style="margin-top:3px">'+streak+' minggu berturut-turut kena target</div>':'')+'</div></div>';
  var bars='', max=TARGET;
  var weeks=[]; for(var i=7;i>=0;i--) weeks.push(addDays(monday(new Date()),-7*i));
  weeks.forEach(function(d){ max=Math.max(max,wc[ymd(d)]||0) });
  weeks.forEach(function(d,i){ var c=wc[ymd(d)]||0; bars+='<div class="b'+(c>=TARGET?' hit':'')+(i===7?' cur':'')+'"><span>'+(c||'')+'</span><i style="height:'+Math.round(c/max*52)+'px"></i></div>' });
  h+='<div class="bars"><div class="tline" style="bottom:'+Math.round(TARGET/max*52+12)+'px"></div>'+bars+'</div><div class="small muted" style="margin-top:4px">8 minggu terakhir · garis putus = target '+TARGET+'</div></div>';

  var m0=today().slice(0,7), month=ss.filter(function(s){return s.date.slice(0,7)===m0}).length;
  h+='<div class="stats"><div class="card"><div class="big">'+ss.length+'</div><div class="l">Total 121</div></div><div class="card"><div class="big">'+P.filter(function(p){return p.n}).length+'</div><div class="l">Orang</div></div><div class="card"><div class="big">'+month+'</div><div class="l">Bulan ini</div></div></div>';

  if(ss.length){
    var rin=P.filter(function(p){return p.rin}).length, rout=P.filter(function(p){return p.rout}).length, both=P.filter(function(p){return p.rin&&p.rout}).length;
    h+='<div class="card"><h2>Referral</h2><div class="row" style="justify-content:space-around;text-align:center"><div><div class="big">'+rin+'</div><div class="small muted">orang kasih saya<br>referral bagus</div></div><div><div class="big">'+rout+'</div><div class="small muted">orang yang saya<br>kasih referral</div></div><div><div class="big">'+both+'</div><div class="small muted">dua arah</div></div></div></div>';
    var kc={}, cc={}, kp={};
    ss.forEach(function(s){ var pr=P.filter(function(p){return p.pid===s.pid})[0]; var k=trim((pr&&pr.f.klas)||s.klas), c=trim((pr&&pr.f.chapter)||s.chapter);
      if(k){ kc[k]=(kc[k]||0)+1 } if(c){ cc[c]=(cc[c]||0)+1 } });
    h+='<div class="card"><h2>Klasifikasi paling sering 121</h2>'+barList(kc,5)+'</div>';
    if(Object.keys(cc).length>1) h+='<div class="card"><h2>Chapter</h2>'+barList(cc,4)+'</div>';
  }

  var fu=P.filter(function(p){ return p.n && !p.up && (p.next || days(p.lastDate)>45) }).sort(function(a,b){ return (a.lastDate<b.lastDate)?-1:1 }).slice(0,4);
  if(fu.length){
    h+='<div class="sec">Perlu tindak lanjut</div>';
    fu.forEach(function(p){
      var why=p.next?('Next step: '+p.next):('Sudah '+days(p.lastDate)+' hari tidak 121');
      h+='<div class="card" style="padding:11px 14px"><div class="row"><div class="grow" onclick="openPerson(\''+p.pid+'\')" style="cursor:pointer"><b>'+esc(p.name)+'</b> <span class="small muted">· '+esc(ago(p.lastDate))+'</span><div class="small" style="margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+esc(why)+'</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="schedFor(\''+p.pid+'\')">Jadwalkan</button>'+(p.f.wa?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+esc(waLink(p.f.wa,msgFollow(p)))+'">WhatsApp</a>':'')+'</div></div></div>';
    });
  }

  h+='<div class="sec">Cari &amp; terakhir 121</div><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Cari nama, bisnis, trigger words, isi catatan…" value="'+esc(S.q)+'" oninput="S.q=this.value;fillList()"></div><div id="plist"></div>';
  return h;
}
function barList(map,n){
  var keys=Object.keys(map).sort(function(a,b){return map[b]-map[a]}).slice(0,n), mx=map[keys[0]]||1, h='';
  keys.forEach(function(k){ h+='<div class="bar"><span class="nm">'+esc(k)+'</span><span class="tr"><i style="width:'+Math.round(map[k]/mx*100)+'%"></i></span><span class="ct">'+map[k]+'</span></div>' });
  return h||'<div class="small muted">Belum ada data. Isi klasifikasi di catatan 121.</div>';
}
function fillList(){
  var q=trim(S.q).toLowerCase(), P=people().filter(function(p){return p.n}).sort(byRecent), h='';
  if(q){ var terms=q.split(/\s+/); P=P.filter(function(p){ return terms.every(function(t){return p.hay.indexOf(t)>=0}) }) }
  else P=P.slice(0,6);
  if(!P.length) h='<div class="empty">'+(q?'Tidak ada yang cocok.':'Belum ada catatan 121. Mulai dari tab Catat.')+'</div>';
  P.forEach(function(p){ h+=card(p) });
  if(!q && people().filter(function(p){return p.n}).length>6) h+='<button class="btn ghost block" onclick="go(\'ppl\')">Lihat semua orang</button>';
  $('plist').innerHTML=h;
}

/* ============ DETAIL ORANG ============ */
function openPerson(pid){
  var p=people().filter(function(x){return x.pid===pid})[0]; if(!p) return;
  var h='<h3>'+esc(p.name)+'</h3><div class="muted" style="margin-top:3px">'+esc([p.f.klas,p.f.chapter].filter(Boolean).join(' · ')||'Klasifikasi belum diisi')+'</div>'
   +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center">'+depthDots(p.depth)+'<span class="tag">'+esc(DEPTH[p.depth-1])+'</span>'+refTags(p)+'<span class="tag">121 ke-'+p.n+'</span>'+(p.lastDate?'<span class="tag">terakhir '+esc(ago(p.lastDate))+'</span>':'')+'</div>';
  if(p.next) h+='<div class="note" style="background:var(--accent-soft);color:var(--ink)"><b>Next step:</b> '+esc(p.next)+'</div>';
  if(p.up) h+='<div class="note ok">Terjadwal: '+esc(fmtStart(p.up))+(p.up.place?' · '+esc(p.up.place):'')+'</div>';
  h+='<div class="btns"><button class="btn" onclick="noteFor(\''+pid+'\')">Catat 121</button><button class="btn ghost" onclick="schedFor(\''+pid+'\')">Jadwalkan</button>'+(p.f.wa?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(waLink(p.f.wa,msgFollow(p)))+'">WhatsApp</a>':'')+'</div>';
  if(p.f.wa) h+='<div class="kv"><div class="k">WhatsApp</div><div class="v"><a class="lnk" target="_blank" rel="noopener" href="'+esc(waLink(p.f.wa))+'">'+esc(p.f.wa)+'</a></div></div>';
  if(p.f.bisnis) h+=kv('Bisnis / layanan',p.f.bisnis);
  if(p.f.bread||p.f.cheese||p.f.meat){
    h+='<div class="kv"><div class="k">Bread · Cheese · Meat</div><div class="bcm">'
     +[['B','Bread',p.f.bread],['C','Cheese',p.f.cheese],['M','Meat',p.f.meat]].map(function(x){ return x[2]?'<div class="'+x[0]+'"><b>'+x[1]+'</b>'+esc(x[2])+'</div>':'' }).join('')+'</div></div>';
  }
  ['trigger','sphere','klien','good','bad'].forEach(function(f){ if(p.f[f]) h+=kv(PROFLABEL[f],p.f[f]) });
  if(p.missing.length) h+='<div class="kv"><div class="k">Belum diketahui (tanyakan di 121 berikutnya)</div><div>'+p.missing.map(function(f){return '<span class="tag warn" style="margin:0 5px 5px 0">'+PROFLABEL[f]+'</span>'}).join('')+'</div></div>';
  h+='<div class="kv"><div class="k">Riwayat 121</div>';
  if(!p.n) h+='<div class="small muted">Belum ada catatan.</div>';
  h+='<div class="tl">';
  p.sess.slice().reverse().forEach(function(s,i){
    h+='<div class="it"><div class="d">'+esc(fdate(s.date))+' <span class="muted" style="font-weight:500">· 121 ke-'+(p.n-i)+' · '+esc(DEPTH[lvl(s.depth)-1])+'</span> <a class="lnk" href="#" onclick="editSession(\''+s.id+'\');return false" style="float:right">Edit</a></div>'
     +(trim(s.notes)?'<div class="t">'+esc(s.notes)+'</div>':'<div class="t muted">(tanpa catatan)</div>')+(trim(s.next)?'<div class="n">➜ '+esc(s.next)+'</div>':'')+'</div>';
  });
  h+='</div></div>';
  openModal(h);
}
function kv(k,v){ return '<div class="kv"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>' }
function msgFollow(p){
  var f=first(p.name);
  if(p.n && p.next) return 'Halo '+f+', terima kasih untuk 121 kita ('+fdate(p.lastDate)+'). Next step kita: '+p.next+'. Saya kabari perkembangannya ya.';
  if(p.n && days(p.lastDate)<=14) return 'Halo '+f+', terima kasih untuk 121 kita kemarin. Senang bisa kenal bisnisnya lebih dalam.';
  return 'Halo '+f+', sudah lama kita tidak ngobrol. Apa kabar bisnisnya? Kapan bisa 121 lagi?';
}
function msgRemind(x){
  var d=pd(x.start);
  return 'Halo '+first(x.name)+', mengingatkan 121 kita '+HARI[d.getDay()]+', '+fdate(x.start)+' jam '+x.start.slice(11,16)+(x.place?' di '+x.place:'')+'.'+(trim(x.agenda)?' Rencananya kita bahas: '+x.agenda+'.':'')+' Sampai ketemu!';
}
function fmtStart(x){ var d=pd(x.start); return HARI[d.getDay()]+', '+fdate(x.start)+' · '+x.start.slice(11,16) }

/* ============ CATAT ============ */
function noteFor(pid){ var p=people().filter(function(x){return x.pid===pid})[0]; closeModal(); S.edit=null; S.pre={name:p.name}; go('note') }
function editSession(id){ closeModal(); S.edit=id; S.pre=null; go('note') }
function fld(id,lab,val,opt){
  opt=opt||{};
  var ph=opt.ph?' placeholder="'+esc(opt.ph)+'"':'', hint=opt.hint?' <span class="hint">'+esc(opt.hint)+'</span>':'';
  var inp = opt.area ? '<textarea id="'+id+'"'+ph+(opt.rows?' style="min-height:'+opt.rows*24+'px"':'')+'>'+esc(val)+'</textarea>' : '<input id="'+id+'" value="'+esc(val)+'"'+ph+(opt.list?' list="'+opt.list+'"':'')+(opt.type?' type="'+opt.type+'"':'')+' autocomplete="off">';
  return '<div><label for="'+id+'">'+lab+hint+'</label>'+inp+'</div>';
}

  var e = S.edit ? S.sessions.filter(function(s){return s.id===S.edit})[0] : null;
  var pre = S.pre||{}, v = e || {date:today(),name:pre.name||'',depth:'1'};
  var P=people(), h='<datalist id="dl-names">'+P.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')+'</datalist>'

   +'<label for="f-depth">Kedalaman hubungan sekarang</label><select id="f-depth">'+DEPTH.map(function(d,i){return '<option value="'+(i+1)+'"'+(lvl(v.depth)===i+1?' selected':'')+'>'+(i+1)+' · '+d+'</option>'}).join('')+'</select>'

   +'<label style="display:flex;gap:8px;align-items:center;font-weight:500;margin-top:6px"><input type="checkbox" id="f-rout" style="width:auto"'+(v.rout==="1"?' checked':'')+'> Saya pernah kasih dia referral</label>'
   +'</div>'

   +fld('f-bread','Bread',v.bread||'',{ph:'Produk entry level + harga',area:1})
   +fld('f-cheese','Cheese',v.cheese||'',{ph:'Produk utama + harga',area:1})
   +fld('f-meat','Meat',v.meat||'',{ph:'Produk premium / proyek besar + harga',area:1})
   +fld('f-trigger','Trigger words',v.trigger||'',{area:1,ph:'Kalimat yang saya dengar lalu langsung ingat dia'})
   +'</div>'
   +'<div class="card"><h2>Jaringan &amp; referral</h2>'

   +fld('f-klien','Contoh klien',v.klien||'',{area:1})

   +fld('f-bad','Bad referrals',v.bad||'',{area:1,ph:'Yang tidak cocok / bukan target'})

function aNote(){
  var nm=$('f-name'); if(!nm) return;
  var e=S.edit;
  var apply=function(){
    var p=findPerson(nm.value), hint=$('f-hint');
    if(!p||e){ hint.innerHTML=''; return }
    PROF.forEach(function(k){ var el=$('f-'+k); if(el && !trim(el.value) && p.f[k]) el.value=p.f[k] });
    $('f-depth').value=p.depth; $('f-rin').checked=p.rin; $('f-rout').checked=p.rout;
    hint.innerHTML='<div class="note ok">Sudah 121 '+p.n+'x, terakhir '+esc(fdate(p.lastDate))+'. Data lama terisi otomatis, ubah kalau ada update.'
      +(p.next?'<br><b>Next step sebelumnya:</b> '+esc(p.next):'')+(p.missing.length?'<br><b>Belum diketahui:</b> '+esc(p.missing.map(function(f){return PROFLABEL[f]}).join(', ')):'')+'</div>';
  };
  nm.addEventListener('change',apply); nm.addEventListener('blur',apply);
  if(S.pre){ apply(); S.pre=null }
}
function val(id){ var el=$(id); return el?el.value.trim():'' }
function saveNote(thenSched){
  var name=val('f-name'); if(!name){ toast('Nama wajib diisi'); $('f-name').focus(); return }
  if(!val('f-date')){ toast('Tanggal wajib diisi'); return }
  var old = S.edit ? S.sessions.filter(function(s){return s.id===S.edit})[0] : null;
  var ex = findPerson(name); if(ex&&!old) name=ex.name;
  var row = {id:old?old.id:uid('s_'), pid: old?old.pid:(ex?ex.pid:uid('p_')), name:name, date:val('f-date'), depth:val('f-depth'), notes:val('f-notes'), next:val('f-next'), deleted:''};
  PROF.forEach(function(k){ row[k]=val('f-'+k) }); row.rin=$('f-rin').checked?'1':''; row.rout=$('f-rout').checked?'1':'';
  enqueue('Sessions',row);
  // tandai jadwal terkait selesai (121 terjadwal yang sudah lewat untuk orang ini)
  live(S.sched).filter(function(x){return x.pid===row.pid&&x.status==='planned'&&x.start.slice(0,10)<=row.date}).forEach(function(x){ x.status='done'; enqueue('Schedule',x) });
  S.edit=null; S.pre=null;
  toast('Tersimpan: '+name);
  if(thenSched){ S.spre={pid:row.pid,name:name,agenda:row.next}; go('sched') } else go('dash');
}
function delSession(){
  var s=S.sessions.filter(function(x){return x.id===S.edit})[0]; if(!s||!confirm('Hapus catatan 121 tanggal '+fdate(s.date)+'?')) return;
  s.deleted='1'; enqueue('Sessions',s); S.edit=null; toast('Catatan dihapus'); go('dash');
}

/* ============ JADWAL ============ */
function schedFor(pid){ var p=people().filter(function(x){return x.pid===pid})[0]; closeModal(); S.spre={pid:pid,name:p.name,agenda:p.next}; go('sched') }
function vSched(){
  var P=people(), pre=S.spre||{}, now=nowLocal();
  var d=addDays(new Date(),1), def=ymd(d);
  var h='<datalist id="dl-names2">'+P.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')+'</datalist>'
   +'<div class="card"><h2>Jadwal 121 baru</h2>'
   +fld('s-name','Dengan siapa',pre.name||'',{list:'dl-names2',ph:'Ketik nama'})
   +'<div id="s-hint"></div>'
   +'<div class="two">'+fld('s-date','Tanggal',def,{type:'date'})+fld('s-time','Jam','10:00',{type:'time'})+'</div>'
   +'<div class="two"><div><label for="s-dur">Durasi</label><select id="s-dur">'+[30,45,60,90,120].map(function(m){return '<option value="'+m+'"'+(m===60?' selected':'')+'>'+m+' menit</option>'}).join('')+'</select></div>'+fld('s-place','Tempat',"",{ph:'Cafe / Zoom / kantor dia'})+'</div>'
   +fld('s-agenda','Agenda / next step',pre.agenda||'',{area:1,ph:'Terisi dari next step terakhir'})
   +(connected()?'<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="s-cal" checked style="width:auto"> Masukkan ke Google Calendar saya</label>':'<div class="note">Belum terhubung ke Sheet &amp; Calendar. Setelah simpan, ada tombol “Tambah ke Google Calendar”. Hubungkan di Pengaturan (ikon status kanan atas).</div>')
   +'<div class="btns"><button class="btn" onclick="saveSched()">Simpan jadwal</button></div></div>';
  var all=live(S.sched).filter(function(x){return x.status==='planned'});
  var up=all.filter(function(x){return x.start>=now}).sort(function(a,b){return a.start<b.start?-1:1});
  var past=all.filter(function(x){return x.start<now}).sort(function(a,b){return a.start<b.start?1:-1});
  h+='<div class="sec">Akan datang</div>'+(up.length?up.map(function(x){return schedItem(x,false)}).join(''):'<div class="empty">Belum ada jadwal.</div>');
  if(past.length) h+='<div class="sec">Sudah lewat, belum dicatat</div>'+past.map(function(x){return schedItem(x,true)}).join('');
  return h;
}
function schedItem(x,past){
  var d=pd(x.start), p=findPerson(x.name);
  var link = !connected()||!x.eventId ? '<a class="lnk" target="_blank" rel="noopener" href="'+esc(calLink(x))+'">Tambah ke Google Calendar</a>' : '<span class="tag ok">Di Google Calendar</span>';
  return '<div class="card sc'+(past?' past':'')+'"><div class="dt"><span>'+BLN[d.getMonth()]+'</span><b>'+d.getDate()+'</b></div><div class="grow"><div><b>'+esc(x.name)+'</b> <span class="small muted">'+HARI[d.getDay()]+' · '+x.start.slice(11,16)+' · '+esc(x.dur)+' mnt</span></div>'
   +(x.place?'<div class="small muted">'+esc(x.place)+'</div>':'')+(trim(x.agenda)?'<div class="ag">➜ '+esc(x.agenda)+'</div>':'')
   +'<div class="btns" style="margin-top:9px;align-items:center">'+(past?'<button class="btn sm" onclick="doneSched(\''+x.id+'\')">Catat hasilnya</button>':link)
   +(p&&p.f.wa?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+esc(waLink(p.f.wa,msgRemind(x)))+'">Ingatkan via WA</a>':'')+'<button class="btn sm ghost" onclick="openPerson(\''+x.pid+'\')">Profil</button><button class="btn danger sm" onclick="cancelSched(\''+x.id+'\')">Batalkan</button></div></div></div>';
}
function calLink(x){
  var s=x.start.replace(/[-:]/g,'')+'00', d=pd(x.start); var e=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+x.start.slice(11,13),+x.start.slice(14,16)+(+x.dur||60));
  var en=ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('121 · '+x.name)+'&dates='+s+'/'+en+'&details='+encodeURIComponent(x.agenda||'')+'&location='+encodeURIComponent(x.place||'');
}
function aSched(){
  var nm=$('s-name'); if(!nm) return;
  var apply=function(){
    var p=findPerson(nm.value), hint=$('s-hint'); if(!p){ hint.innerHTML=''; return }
    var ag=$('s-agenda'); if(!trim(ag.value)&&p.next) ag.value=p.next;
    hint.innerHTML='<div class="note ok">121 ke-'+(p.n+1)+' dengan '+esc(p.name)+(p.lastDate?', terakhir '+esc(ago(p.lastDate)):'')+'.'+(p.missing.length?'<br><b>Hal yang belum diketahui:</b> '+esc(p.missing.map(function(f){return PROFLABEL[f]}).join(', ')):'')+'</div>';
  };
  nm.addEventListener('change',apply); nm.addEventListener('blur',apply);
  if(S.spre){ apply(); S.spre=null }
}
function saveSched(){
  var name=val('s-name'); if(!name){ toast('Nama wajib diisi'); return }
  if(!val('s-date')||!val('s-time')){ toast('Tanggal dan jam wajib diisi'); return }
  var ex=findPerson(name), cal=$('s-cal'); if(ex) name=ex.name;
  var row={id:uid('c_'),pid:ex?ex.pid:uid('p_'),name:name,start:val('s-date')+'T'+val('s-time'),dur:val('s-dur'),place:val('s-place'),agenda:val('s-agenda'),status:'planned',cal:(cal&&cal.checked)?'1':'',eventId:'',deleted:''};
  enqueue('Schedule',row);
  toast(row.cal?'Jadwal tersimpan, masuk Calendar':'Jadwal tersimpan'); render();
}
function cancelSched(id){
  var x=S.sched.filter(function(s){return s.id===id})[0]; if(!x||!confirm('Batalkan jadwal dengan '+x.name+'?')) return;
  x.status='cancelled'; enqueue('Schedule',x); render();
}
function doneSched(id){ var x=S.sched.filter(function(s){return s.id===id})[0]; S.edit=null; S.pre={name:x.name}; go('note'); var d=$('f-date'); if(d) d.value=x.start.slice(0,10) }

/* ============ ORANG ============ */
function vPpl(){
  var P=people().filter(function(p){return p.n}), kl={};
  P.forEach(function(p){ var k=trim(p.f.klas); if(k) kl[k]=(kl[k]||0)+1 });
  var keys=Object.keys(kl).sort(function(a,b){return kl[b]-kl[a]});
  var h='<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" placeholder="Cari…" value="'+esc(S.q)+'" oninput="S.q=this.value;fillAll()"></div>'
   +'<div class="chips"><button class="chip'+(S.filt?'':' on')+'" onclick="S.filt=\'\';render()">Semua '+P.length+'</button>'
   +keys.map(function(k){ return '<button class="chip'+(S.filt===k?' on':'')+'" onclick="S.filt=this.dataset.k;render()" data-k="'+esc(k)+'">'+esc(k)+' '+kl[k]+'</button>' }).join('')+'</div><div id="pall"></div>';
  setTimeout(fillAll,0);
  return h;
}
function fillAll(){
  var q=trim(S.q).toLowerCase(), P=people().filter(function(p){return p.n}).sort(byRecent);
  if(S.filt) P=P.filter(function(p){return trim(p.f.klas)===S.filt});
  if(q){ var t=q.split(/\s+/); P=P.filter(function(p){return t.every(function(w){return p.hay.indexOf(w)>=0})}) }
  $('pall').innerHTML=P.length?P.map(card).join(''):'<div class="empty">Tidak ada yang cocok.</div>';
}

/* ============ PENGATURAN ============ */
function openSettings(){
  var h='<h3>Pengaturan &amp; sinkron</h3>'
   +'<div class="muted small" style="margin-top:4px">'+(connected()?'Data tersimpan di Google Sheet Anda. Perangkat ini menyimpan salinan agar tetap bisa dibuka tanpa sinyal.':'Saat ini data hanya tersimpan di browser perangkat ini. Hubungkan ke Google Sheet agar aman dan sinkron antar perangkat.')+'</div>'
   +fld('c-url','URL Web App (Apps Script)',S.cfg.url,{ph:'https://script.google.com/macros/s/…/exec'})
   +fld('c-tok','Kata sandi (TOKEN di Code.gs)',S.cfg.token,{ph:'sama persis dengan Code.gs'})
   +'<div class="btns"><button class="btn" onclick="saveCfg()">Simpan &amp; tes koneksi</button>'+(connected()?'<button class="btn ghost" onclick="closeModal();syncAll().then(function(){toast(\'Sinkron selesai\')})">Sinkron sekarang</button>':'')+'</div>'
   +(S.lastSync?'<div class="small muted" style="margin-top:8px">Terakhir sinkron: '+new Date(S.lastSync).toLocaleString('id-ID')+'</div>':'')
   +'<div class="kv"><div class="k">Backup</div><div class="btns" style="margin-top:6px"><button class="btn ghost sm" onclick="exportJson()">Unduh JSON</button><button class="btn ghost sm" onclick="$(\'imp\').click()">Impor JSON</button><input type="file" id="imp" accept="application/json" style="display:none" onchange="importJson(this)"></div></div>'
   +'<div class="small muted" style="margin-top:14px">Langkah pasang Sheet &amp; Calendar ada di README repo (folder apps-script).</div>';
  openModal(h);
}
function saveCfg(){
  S.cfg.url=val('c-url'); S.cfg.token=val('c-tok'); save(); setSync();
  if(!connected()){ toast('Disimpan. Mode lokal.'); closeModal(); return }
  post({action:'ping'}).then(function(r){
    if(!r.ok) throw new Error(r.error);
    toast('Terhubung. Mengirim data…'); closeModal();
    // dorong semua data lokal pertama kali, lalu tarik dari Sheet
    live(S.sessions).forEach(function(s){ if(!S.queue.some(function(q){return q.id===s.id})) S.queue.push({table:'Sessions',id:s.id}) });
    S.sched.forEach(function(s){ if(!S.queue.some(function(q){return q.id===s.id})) S.queue.push({table:'Schedule',id:s.id}) });
    save(); syncAll();
  }).catch(function(e){ toast(String(e.message)==='token'?'Token salah':'Gagal terhubung. Cek URL dan deploy "Anyone".') });
}
function exportJson(){
  var b=new Blob([JSON.stringify({sessions:S.sessions,sched:S.sched},null,1)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='121-notebook-'+today()+'.json'; a.click();
}
function importJson(inp){
  var f=inp.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result); merge(S.sessions,d.sessions); merge(S.sched,d.sched); d.sessions.forEach(function(s){S.queue.push({table:'Sessions',id:s.id})}); (d.sched||[]).forEach(function(s){S.queue.push({table:'Schedule',id:s.id})}); save(); closeModal(); render(); flush(); toast('Impor selesai') }catch(e){ toast('File tidak valid') } };
  r.readAsText(f);
}

/* ============ start ============ */
load(); setSync(); render();
if(connected()) syncAll();
window.addEventListener('online',function(){ S.offline=false; syncAll() });
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&connected()&&Date.now()-S.lastSync>60000) syncAll() });
</script>
